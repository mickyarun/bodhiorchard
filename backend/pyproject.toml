[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# Hatchling auto-detects the source directory by matching the project
# name (``bodhiorchard-backend`` → looks for ``bodhiorchard_backend/``).
# This project lives under ``app/`` instead, so the discovery has to be
# explicit — without this block, ``pip install -e ".[dev]"`` fails in
# fresh CI build envs with "Unable to determine which files to ship".
[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "bodhiorchard-backend"
version = "0.1.0"
description = "Glideship AI-powered software development platform backend"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy[asyncio]>=2.0.23,<2.1",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    # Public holidays by country/region for leave policies (MIT).
    "holidays>=0.60,<1",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-jose[cryptography]>=3.3.0",
    # AES-GCM for employees' sensitive details and documents.
    "cryptography>=42.0",
    "pyjwt[crypto]>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    # passlib 1.7.x reads `bcrypt.__about__.__version__`, removed in bcrypt 5.0.
    # Without this pin, passlib's backend probe raises ValueError on every
    # hash/verify call. Hold at 4.x until passlib 2.x ships.
    "bcrypt>=4.1,<5.0",
    "python-multipart>=0.0.6",
    "httpx>=0.27.0",
    "fastembed>=0.4.0",
    # Profile-photo re-encoding: strips EXIF/GPS and normalises size and
    # format before a photo is served publicly.
    "pillow>=10.0",
    "pgvector>=0.2.4",
    "redis>=5.0.0,<9",
    "structlog>=24.1.0",
    "cachetools>=5.3.0",
    "pyyaml>=6.0",
    "graphifyy[leiden]>=0.5.5,<0.10",
    "networkx>=3.2",
    # S3 backend for QA evidence uploads (``FILE_STORAGE_S3=true``).
    # ``aioboto3`` pulls in ``aiobotocore`` + ``botocore`` transitively;
    # the lazy ``import aioboto3`` inside ``file_storage.py`` would fail
    # with ``ModuleNotFoundError`` on first upload otherwise.
    "aioboto3>=12.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    # 1.x: the loop scope is set by the options below, not an event_loop fixture.
    "pytest-asyncio>=1.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "respx>=0.21.0",
    "ruff==0.17.1",  # pinned — matches CI; a floating ruff reformats on release
    "mypy>=1.7.0,<2",
    "types-cachetools",
    "httpx>=0.27.0",
    # Opt-in: integration tests that need a real Postgres spin up an
    # ephemeral container via testcontainers. The default ``pytest``
    # suite does NOT exercise these — run with ``-m integration`` to
    # opt in, see ``tests/integration/conftest.py``.
    "testcontainers[postgres]>=4.14.0",
]

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
# RUF006 catches ``asyncio.create_task(...)`` calls that don't hold the
# returned Task — the GC anchor bug that silently dropped dev_activity
# and member_presence publishes to Colyseus in the dashboard pipeline.
# See ``handlers_hooks._publish_tasks`` / ``event_bus._transport_tasks``
# for the correct pattern.
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM", "RUF006"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
# PEP 695 generic syntax (`def f[T](...)`) is used in `scan/_async_compute.py`
# and `scan/session.py`. mypy gates the parser behind this flag until the
# implementation stabilises; the runtime accepts it on 3.12+ already.
enable_incomplete_feature = ["NewGenericSyntax"]

[[tool.mypy.overrides]]
module = [
    "networkx",
    "networkx.*",
    "graphify.*",
    "pgvector.*",
    "aioboto3",
    "botocore",
    "botocore.*",
    "yaml",
    "jose",
    "jose.*",
    "passlib.*",
    "cachetools",
    "testcontainers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole session, tests and fixtures alike. Session
# fixtures (the integration Postgres, a module-level lock or pool) are
# created on the first test's loop; a loop per test would leave them
# attached to a closed one ("attached to a different loop").
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# Heavy / Docker-dependent tests are gated behind the ``integration``
# marker so the default ``pytest`` run stays fast and works without
# Docker. Opt in with ``pytest -m integration`` once a Docker daemon
# is reachable (see ``tests/integration/conftest.py``).
markers = [
    "integration: spins up a real Postgres container; needs Docker.",
    "slow: takes several seconds (real git, indexer or scan pipeline); deselect with -m 'not slow'.",
]
addopts = "-m 'not integration'"
