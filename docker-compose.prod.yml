# Production deployment — all secrets from .env, TLS via Caddy.
#
# Usage:
#   cp .env.production.example .env.production
#   nano .env.production          # fill in domain + secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-bodhiorchard}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-bodhiorchard}"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bodhiorchard}
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      EMBEDDING_PROVIDER: fastembed
      EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
      EMBEDDING_DIMENSIONS: "384"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_MODEL: ${LLM_MODEL:-claude-haiku-4-5-20251001}
      LLM_PREMIUM_MODEL: ${LLM_PREMIUM_MODEL:-claude-sonnet-4-6}
      COLYSEUS_URL: http://multiplayer:2567
      COLYSEUS_BRIDGE_SECRET: ${COLYSEUS_BRIDGE_SECRET}
      PUBLIC_URL: ${PUBLIC_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      ENV: production
      GITHUB_PAT: ${GITHUB_PAT:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      # File storage. Without these the container never sees the
      # operator's choice: pydantic-settings reads the process
      # environment, and compose passes through only what is listed
      # here — so FILE_STORAGE_S3=true in the host .env silently had no
      # effect and uploads went to the local volume instead of S3.
      # Unset leaves the shipped defaults (local disk under
      # FILE_STORAGE_LOCAL_DIR), which the uploads_data volume backs.
      FILE_STORAGE_S3: ${FILE_STORAGE_S3:-false}
      FILE_STORAGE_S3_BUCKET: ${FILE_STORAGE_S3_BUCKET:-}
      FILE_STORAGE_LOCAL_DIR: ${FILE_STORAGE_LOCAL_DIR:-data/uploads}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      # Leave both blank to use the instance role / IAM task role, which
      # is what boto3's default chain picks up when no explicit pair is
      # set. Setting only one of them is treated as "no explicit creds".
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - repos_data:/data/repos
      - ssh_data:/data/ssh
      # Uploaded files (QA evidence, bug attachments) when the local-disk
      # storage backend is in use, which is the default. WORKDIR is /app
      # and FILE_STORAGE_LOCAL_DIR defaults to the relative
      # ``data/uploads``, so without this they live on the container's
      # writable layer and every redeploy silently orphans them: the DB
      # rows survive and point at bytes that are gone. Deploys that set
      # FILE_STORAGE_S3=true don't use this path, and an unused named
      # volume costs nothing.
      - uploads_data:/app/data/uploads
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  multiplayer:
    build:
      context: .
      dockerfile: multiplayer/Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      COLYSEUS_BRIDGE_SECRET: ${COLYSEUS_BRIDGE_SECRET}
      NODE_ENV: production
    depends_on:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
      - multiplayer
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
  repos_data:
  ssh_data:
  uploads_data:
  caddy_data:
  caddy_config:
