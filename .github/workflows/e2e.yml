name: Browser e2e

# Playwright against a throwaway stack the suite starts itself (Docker
# Postgres and Redis, the backend with every external service faked,
# multiplayer and the Vite dev server). No ``paths:`` filter, like the other
# quality workflows, so the check always reports.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    name: playwright (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.22.1"
          cache: "npm"

      - name: Install backend (with dev extras)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install workspace deps
        run: npm ci

      - name: Type-check the suite
        run: npm --workspace glideship-e2e run typecheck

      - name: Install Chromium
        run: npx --workspace glideship-e2e playwright install --with-deps chromium

      - name: Pull stack images
        run: |
          docker pull -q pgvector/pgvector:pg16
          docker pull -q redis:7-alpine

      - name: Run Playwright
        env:
          CI: "1"
          E2E_PYTHON: python
        run: npm --workspace glideship-e2e test

      - name: Upload report, traces and stack logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/.stack/logs/
            e2e/.stack/guard.log
          retention-days: 7
          include-hidden-files: true
