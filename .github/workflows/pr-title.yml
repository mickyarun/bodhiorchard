name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-commit:
    name: Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Allowed types — keep in sync with the commit-message style used
          # in `git log` on main (feat, fix, chore, refactor, scan, perf, …).
          types: |
            feat
            fix
            chore
            refactor
            perf
            docs
            test
            ci
            build
            revert
            scan
          requireScope: false
          # The lowercase-subject rule is for people, not bots. Dependabot
          # titles every PR "Bump x from a to b" and rewrites the title back
          # to that on each rebase, so correcting one by hand never survives
          # — the rule rejected 100% of its pull requests and nothing it
          # opened could merge. Bots keep the type and scope check and skip
          # the subject check; for everyone else nothing changes.
          subjectPattern: >-
            ${{ endsWith(github.event.pull_request.user.login, '[bot]')
            && '.+' || '^(?![A-Z]).+$' }}
          subjectPatternError: |
            The subject "{subject}" must start with a lowercase letter.
            Example: "feat(backend): add foo" not "feat(backend): Add foo".
