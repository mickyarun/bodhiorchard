    <!-- JSON-LD: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        { "@type": "Question", "name": "What is Agent-Driven Development?", "acceptedAnswer": { "@type": "Answer", "text": "Agent-Driven Development (ADD) is a way of building software where specialised AI agents drive every phase of the lifecycle — intake, spec, design, tech architecture, implementation, testing, UAT, deployment, retrospective — and humans review, decide, and steer. Bodhiorchard is the open-source reference implementation." } },
        { "@type": "Question", "name": "Is Bodhiorchard a self-hosted Jira alternative?", "acceptedAnswer": { "@type": "Answer", "text": "Yes — for the workflow layer. Bodhiorchard sits between IDE-side AI coding assistants and traditional PM tools. It is especially relevant to teams looking for an Atlassian DC alternative, since Atlassian is sunsetting new self-hosted Jira licences in March 2026 with full shutdown in 2029." } },
        { "@type": "Question", "name": "Does my code leave my machine when I use Bodhiorchard?", "acceptedAnswer": { "@type": "Answer", "text": "The data plane is always local — Postgres, embeddings, BUDs, scanned repos, and the audit log all sit on your hardware. Only the LLM prompts leave your machine, and only when you choose a cloud inference mode." } },
        { "@type": "Question", "name": "What does BUD mean in Bodhiorchard?", "acceptedAnswer": { "@type": "Answer", "text": "BUD stands for Business Understanding Document. Every feature lives in one BUD containing spec, tech spec, test plan, acceptance criteria, and full history — all in markdown." } },
        { "@type": "Question", "name": "What is Bodhiorchard's licence? Can I use it commercially?", "acceptedAnswer": { "@type": "Answer", "text": "Bodhiorchard is licensed under the Apache License 2.0, which permits commercial use including embedding in proprietary products. Contributions require DCO sign-off via git commit -s." } }
      ]
    }
